version: "3.9"

services:

  #########################################################
  # UI
  #########################################################

  ui:
    image: ${ECR_REGISTRY}/ui:latest
    container_name: ui
    hostname: ui
    restart: always
    ports:
      - "8888:8080"
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom"
      SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
    depends_on:
      - catalog
      - cart
      - orders
      - checkout
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - retail-network

  #########################################################
  # CATALOG
  #########################################################

  catalog:
    image: ${ECR_REGISTRY}/catalog:latest
    container_name: catalog
    hostname: catalog
    restart: always
    ports:
      - "8081:8080"
    environment:
      GIN_MODE: release
      RETAIL_CATALOG_PERSISTENCE_PROVIDER: mysql
      RETAIL_CATALOG_PERSISTENCE_ENDPOINT: catalog-db:3306
      RETAIL_CATALOG_PERSISTENCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      catalog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - retail-network

  catalog-db:
    image: mariadb:10.9
    container_name: catalog-db
    hostname: catalog-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: catalogdb
      MYSQL_USER: catalog_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - catalog-db:/var/lib/mysql
    healthcheck:
      test: ["CMD","mariadb-admin","ping","-h","localhost"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - retail-network

  #########################################################
  # CART
  #########################################################

  cart:
    image: ${ECR_REGISTRY}/cart:latest
    container_name: cart
    hostname: carts
    restart: always
    ports:
      - "8082:8080"
    environment:
      SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
      RETAIL_CART_PERSISTENCE_PROVIDER: dynamodb
      RETAIL_CART_PERSISTENCE_DYNAMODB_ENDPOINT: http://carts-db:8000
      RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE: "true"
      AWS_ACCESS_KEY_ID: key
      AWS_SECRET_ACCESS_KEY: dummy
    depends_on:
      carts-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - retail-network

  carts-db:
    image: amazon/dynamodb-local:1.20.0
    container_name: carts-db
    hostname: carts-db
    restart: always
    command: "-jar DynamoDBLocal.jar -sharedDb"
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL","exit 0"]
    networks:
      - retail-network

  #########################################################
  # ORDERS
  #########################################################

  orders:
    image: ${ECR_REGISTRY}/orders:latest
    container_name: orders
    hostname: orders
    restart: always
    ports:
      - "8083:8080"
    environment:
      SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
      RETAIL_ORDERS_PERSISTENCE_PROVIDER: postgres
      RETAIL_ORDERS_PERSISTENCE_ENDPOINT: orders-db:5432
      RETAIL_ORDERS_PERSISTENCE_NAME: orders
      RETAIL_ORDERS_PERSISTENCE_USERNAME: orders_user
      RETAIL_ORDERS_PERSISTENCE_PASSWORD: ${DB_PASSWORD}
      RETAIL_ORDERS_MESSAGING_PROVIDER: rabbitmq
      RETAIL_ORDERS_MESSAGING_RABBITMQ_ADDRESSES: rabbitmq:5672
      RETAIL_ORDERS_MESSAGING_RABBITMQ_USERNAME: rabbitmq
      RETAIL_ORDERS_MESSAGING_RABBITMQ_PASSWORD: ${DB_PASSWORD}
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - retail-network

  orders-db:
    image: postgres:16
    container_name: orders-db
    restart: always
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U orders_user"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - retail-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: ${DB_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - retail-network

  #########################################################
  # CHECKOUT
  #########################################################

  checkout:
    image: ${ECR_REGISTRY}/checkout:latest
    container_name: checkout
    hostname: checkout
    restart: always
    ports:
      - "8085:8080"
    environment:
      RETAIL_CHECKOUT_PERSISTENCE_PROVIDER: redis
      RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL: redis://checkout-redis:6379
    depends_on:
      checkout-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - retail-network

  checkout-redis:
    image: redis:7-alpine
    container_name: checkout-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - retail-network

#########################################################
# NETWORKS
#########################################################

networks:
  retail-network:
    driver: bridge

#########################################################
# VOLUMES
#########################################################

volumes:
  postgres-data:
  catalog-db:
  dynamodb-data:
