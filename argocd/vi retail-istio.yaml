apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-istio
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/TerraFormtool/k8s-microservices-ecommerce-app.git
    targetRevision: main
    path: k8s/istio

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
