apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-ecommerce
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/TerraFormtool/k8s-microservices-ecommerce-app.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: retail

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
