apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog
  namespace: retail

spec:

  scaleTargetRef:

    apiVersion: apps/v1
    kind: Deployment
    name: catalog

  minReplicas: 2
  maxReplicas: 6

  behavior:

    scaleUp:

      stabilizationWindowSeconds: 0

    scaleDown:

      stabilizationWindowSeconds: 300

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization
          averageUtilization: 70
