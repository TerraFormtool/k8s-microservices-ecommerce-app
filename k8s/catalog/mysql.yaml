apiVersion: v1
kind: Service
metadata:
  name: catalog-db
  namespace: retail
spec:
  type: ClusterIP

  selector:
    app: catalog-db

  ports:
    - name: mysql
      port: 3306
      targetPort: 3306


---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-db
  namespace: retail
spec:

  serviceName: catalog-db

  replicas: 1

  selector:
    matchLabels:
      app: catalog-db

  template:

    metadata:
      labels:
        app: catalog-db

    spec:

      terminationGracePeriodSeconds: 60

      securityContext:
        fsGroup: 999

      containers:

        - name: mysql

          image: mysql:8.0

          imagePullPolicy: IfNotPresent

          ports:
            - name: mysql
              containerPort: 3306

          env:

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retail-secrets
                  key: DB_PASSWORD

            - name: MYSQL_DATABASE
              value: catalogdb

            - name: MYSQL_USER
              value: catalog_user

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retail-secrets
                  key: DB_PASSWORD

          resources:

            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: "1"
              memory: 1Gi

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"

            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"

            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"

            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5

          volumeMounts:

            - name: mysql-data
              mountPath: /var/lib/mysql

  volumeClaimTemplates:

    - metadata:
        name: mysql-data

      spec:

        accessModes:
          - ReadWriteOnce

        storageClassName: gp3

        resources:
          requests:
            storage: 20Gi
