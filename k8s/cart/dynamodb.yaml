apiVersion: v1
kind: Service
metadata:
  name: carts-db
  namespace: retail

spec:

  type: ClusterIP

  selector:
    app: carts-db

  ports:

    - name: dynamodb
      port: 8000
      targetPort: 8000


---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamodb-data
  namespace: retail

spec:

  accessModes:
    - ReadWriteOnce

  storageClassName: gp3

  resources:

    requests:
      storage: 10Gi


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts-db
  namespace: retail

spec:

  replicas: 1

  selector:
    matchLabels:
      app: carts-db

  template:

    metadata:
      labels:
        app: carts-db

    spec:

      containers:

        - name: dynamodb

          image: amazon/dynamodb-local:1.20.0

          command:

            - java
            - -jar
            - DynamoDBLocal.jar
            - -sharedDb

          ports:

            - name: dynamodb
              containerPort: 8000

          resources:

            requests:
              cpu: 200m
              memory: 512Mi

            limits:
              cpu: "1"
              memory: 1Gi

          readinessProbe:

            tcpSocket:
              port: dynamodb

            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:

            tcpSocket:
              port: dynamodb

            initialDelaySeconds: 60
            periodSeconds: 20

          volumeMounts:

            - name: dynamodb-data
              mountPath: /home/dynamodblocal/data

      volumes:

        - name: dynamodb-data

          persistentVolumeClaim:
            claimName: dynamodb-data
