apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: retail

  labels:
    app: cart

spec:

  replicas: 0

  revisionHistoryLimit: 5

  strategy:

    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: cart

  template:

    metadata:
      labels:
        app: cart

    spec:

      terminationGracePeriodSeconds: 30

      topologySpreadConstraints:

        - maxSkew: 1

          topologyKey: topology.kubernetes.io/zone

          whenUnsatisfiable: ScheduleAnyway

          labelSelector:
            matchLabels:
              app: cart

      affinity:

        podAntiAffinity:

          preferredDuringSchedulingIgnoredDuringExecution:

            - weight: 100

              podAffinityTerm:

                topologyKey: kubernetes.io/hostname

                labelSelector:
                  matchLabels:
                    app: cart

      containers:

        - name: cart

          image: 302524629943.dkr.ecr.us-east-1.amazonaws.com/cart:latest

          imagePullPolicy: Always

          ports:

            - name: http
              containerPort: 8080

          envFrom:

            - configMapRef:
                name: cart-config

          env:

            - name: AWS_ACCESS_KEY_ID
              value: "key"

            - name: AWS_SECRET_ACCESS_KEY
              value: "dummy"

          resources:

            requests:
              cpu: 50m
              memory: 128Mi

            limits:
              cpu: 250m
              memory: 256Mi

          startupProbe:

            httpGet:
              path: /actuator/health
              port: http

            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:

            httpGet:
              path: /actuator/health
              port: http

            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:

            httpGet:
              path: /actuator/health
              port: http

            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
