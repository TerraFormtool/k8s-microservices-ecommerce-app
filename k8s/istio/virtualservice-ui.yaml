apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: retail-ui
  namespace: retail
spec:
  hosts:
    - retail.metatechz.store
  gateways:
    - retail-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: ui
            port:
              number: 80
