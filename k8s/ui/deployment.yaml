apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: retail

  labels:
    app: ui

spec:

  replicas: 1

  revisionHistoryLimit: 5

  strategy:

    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: ui

  template:

    metadata:
      labels:
        app: ui

    spec:

      terminationGracePeriodSeconds: 30

      topologySpreadConstraints:

        - maxSkew: 1

          topologyKey: topology.kubernetes.io/zone

          whenUnsatisfiable: ScheduleAnyway

          labelSelector:
            matchLabels:
              app: ui

      affinity:

        podAntiAffinity:

          preferredDuringSchedulingIgnoredDuringExecution:

            - weight: 100

              podAffinityTerm:

                topologyKey: kubernetes.io/hostname

                labelSelector:
                  matchLabels:
                    app: ui

      containers:

        - name: ui

          image: 302524629943.dkr.ecr.us-east-1.amazonaws.com/ui:latest

          imagePullPolicy: Always

          ports:

            - name: http
              containerPort: 8080

          envFrom:

            - configMapRef:
                name: ui-config

          resources:

            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi                       

          startupProbe:

            httpGet:
              path: /actuator/health
              port: http

            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:

            httpGet:
              path: /actuator/health
              port: http

            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:

            httpGet:
              path: /actuator/health
              port: http

            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          lifecycle:

            preStop:

              exec:

                command:
                  - /bin/sh
                  - -c
                  - sleep 10
