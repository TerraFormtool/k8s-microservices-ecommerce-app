apiVersion: v1
kind: Service
metadata:
  name: checkout-redis
  namespace: retail

spec:

  type: ClusterIP

  selector:
    app: checkout-redis

  ports:

    - name: redis
      port: 6379
      targetPort: 6379


---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: checkout-redis
  namespace: retail

spec:

  serviceName: checkout-redis

  replicas: 1

  selector:
    matchLabels:
      app: checkout-redis

  template:

    metadata:
      labels:
        app: checkout-redis

    spec:

      containers:

        - name: redis

          image: redis:7-alpine

          ports:

            - name: redis
              containerPort: 6379

          resources:

            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:

            exec:

              command:
                - redis-cli
                - ping

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:

            exec:

              command:
                - redis-cli
                - ping

            initialDelaySeconds: 30
            periodSeconds: 20

          volumeMounts:

            - name: redis-data
              mountPath: /data

  volumeClaimTemplates:

    - metadata:
        name: redis-data

      spec:

        accessModes:
          - ReadWriteOnce

        storageClassName: gp3

        resources:

          requests:
            storage: 10Gi
