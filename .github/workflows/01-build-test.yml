name: CI - Build & Unit Test

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select Service"
        required: true
        type: choice
        options:
          - ui
          - cart
          - orders
          - checkout
          - catalog

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.inputs.service }}
  cancel-in-progress: true

env:
  SERVICE: ${{ github.event.inputs.service }}

jobs:
  build-test:
    runs-on: self-hosted

    defaults:
      run:
        shell: bash

    steps:

      #########################################################
      # CHECKOUT
      #########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #########################################################
      # BUILD INFO
      #########################################################

      - name: Display Build Information
        run: |
          echo "======================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo "Service    : ${SERVICE}"
          echo "Runner     : $RUNNER_NAME"
          echo "======================================="

      #########################################################
      # DETECT RUNTIME
      #########################################################

      - name: Detect Runtime
        run: |
          if [[ "${SERVICE}" == "ui" || "${SERVICE}" == "cart" || "${SERVICE}" == "orders" ]]; then
            echo "RUNTIME=java" >> $GITHUB_ENV
          elif [[ "${SERVICE}" == "checkout" ]]; then
            echo "RUNTIME=node" >> $GITHUB_ENV
          elif [[ "${SERVICE}" == "catalog" ]]; then
            echo "RUNTIME=go" >> $GITHUB_ENV
          else
            echo "Unknown service"
            exit 1
          fi

      #########################################################
      # VERIFY FOLDER
      #########################################################

      - name: Verify Service Folder
        run: |
          if [ ! -d "src/${SERVICE}" ]; then
            echo "Service folder not found"
            exit 1
          fi

      - name: Display Runtime
        run: |
          echo "Runtime: ${RUNTIME}"

      #########################################################
      # JAVA SETUP
      #########################################################

      - name: Setup Java
        if: env.RUNTIME == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      #########################################################
      # NODE SETUP
      #########################################################

      - name: Setup NodeJS
        if: env.RUNTIME == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      #########################################################
      # GO SETUP
      #########################################################

      - name: Setup Go
        if: env.RUNTIME == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      #########################################################
      # MAVEN CACHE
      #########################################################

      - name: Restore Maven Cache
        if: env.RUNTIME == 'java'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles(format('src/{0}/pom.xml', env.SERVICE)) }}
          restore-keys: |
            maven-${{ runner.os }}

      #########################################################
      # GO CACHE
      #########################################################

      - name: Restore Go Modules
        if: env.RUNTIME == 'go'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('src/catalog/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}

      #########################################################
      # DISPLAY TOOL VERSIONS
      #########################################################

      - name: Display Tool Versions
        run: |
          if [ "${RUNTIME}" = "java" ]; then
            java -version
            mvn -version
          fi

          if [ "${RUNTIME}" = "node" ]; then
            node --version
            npm --version
          fi

          if [ "${RUNTIME}" = "go" ]; then
            go version
          fi

      #########################################################
      # JAVA BUILD (TESTS SKIPPED)
      #########################################################

      - name: Build Java Application
        if: env.RUNTIME == 'java'
        working-directory: src/${{ env.SERVICE }}
        run: |
          mvn clean package -DskipTests

      #########################################################
      # NODE BUILD
      #########################################################

      - name: Install Node Dependencies
        if: env.RUNTIME == 'node'
        working-directory: src/checkout
        run: |
          npm install

      - name: Verify Installed Packages
        if: env.RUNTIME == 'node'
        working-directory: src/checkout
        run: |
          npm list --depth=0 || true

      - name: Build Checkout Service
        if: env.RUNTIME == 'node'
        working-directory: src/checkout
        run: |
          npm run build

      - name: Skip Checkout Tests
        if: env.RUNTIME == 'node'
        run: |
          echo "Checkout tests skipped"

      #########################################################
      # GO BUILD
      #########################################################

      - name: Download Go Modules
        if: env.RUNTIME == 'go'
        working-directory: src/catalog
        run: |
          go mod download

      - name: Verify Go Modules
        if: env.RUNTIME == 'go'
        working-directory: src/catalog
        run: |
          go mod verify

      - name: Build Catalog Service
        if: env.RUNTIME == 'go'
        working-directory: src/catalog
        run: |
          go build -v ./...

      - name: Run Go Unit Tests
        if: env.RUNTIME == 'go'
        working-directory: src/catalog
        run: |
          go test -v ./...

      #########################################################
      # VERIFY OUTPUT
      #########################################################

      - name: Verify Java Artifact
        if: env.RUNTIME == 'java'
        run: |
          ls -lh src/${SERVICE}/target

      - name: Verify Node Artifact
        if: env.RUNTIME == 'node'
        run: |
          ls -lh src/checkout/dist || true

      - name: Verify Go Binary
        if: env.RUNTIME == 'go'
        run: |
          ls -lh src/catalog

      #########################################################
      # UPLOAD ARTIFACTS
      #########################################################

      - name: Upload Java Artifact
        if: env.RUNTIME == 'java'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SERVICE }}-jar
          path: src/${{ env.SERVICE }}/target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload Node Artifact
        if: env.RUNTIME == 'node'
        uses: actions/upload-artifact@v4
        with:
          name: checkout-dist
          path: src/checkout/dist/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Go Artifact
        if: env.RUNTIME == 'go'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-binary
          path: src/catalog
          if-no-files-found: warn
          retention-days: 7

      #########################################################
      # BUILD SUMMARY
      #########################################################

      - name: Generate Build Summary
        run: |
          {
            echo "# Build Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Service | ${SERVICE} |"
            echo "| Runtime | ${RUNTIME} |"
            echo "| Repository | ${GITHUB_REPOSITORY} |"
            echo "| Branch | ${GITHUB_REF_NAME} |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Runner | ${RUNNER_NAME} |"
            echo "| Workflow | ${GITHUB_WORKFLOW} |"
          } >> $GITHUB_STEP_SUMMARY

      #########################################################
      # CLEANUP
      #########################################################

      - name: Cleanup Workspace
        if: always()
        run: |
          find . -type f -name "*.tmp" -delete || true
          find . -type f -name "*.log" -delete || true

      #########################################################
      # SUCCESS
      #########################################################

      - name: Build Successful
        run: |
          echo "======================================"
          echo "BUILD COMPLETED SUCCESSFULLY"
          echo "======================================"

      #########################################################
      # OUTPUTS
      #########################################################

      - name: Export Outputs
        id: outputs
        run: |
          echo "service=${SERVICE}" >> $GITHUB_OUTPUT
          echo "runtime=${RUNTIME}" >> $GITHUB_OUTPUT
