name: CI - Quality & Security Scan

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select Service"
        required: true
        type: choice
        options:
          - ui
          - cart
          - orders
          - checkout
          - catalog

permissions:
  contents: read
  security-events: write

concurrency:
  group: quality-security-${{ github.event.inputs.service }}
  cancel-in-progress: true

env:
  SERVICE: ${{ github.event.inputs.service }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  quality-security:

    runs-on: self-hosted

    defaults:
      run:
        shell: bash

    steps:

#########################################################
# CHECKOUT
#########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

#########################################################
# BUILD INFORMATION
#########################################################

      - name: Display Build Information
        run: |
          echo "======================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo "Service    : ${SERVICE}"
          echo "Runner     : $RUNNER_NAME"
          echo "Workflow   : $GITHUB_WORKFLOW"
          echo "======================================="

#########################################################
# VERIFY SERVICE FOLDER
#########################################################

      - name: Verify Service Folder
        run: |
          if [ ! -d "src/${SERVICE}" ]; then
            echo "ERROR: src/${SERVICE} does not exist."
            exit 1
          fi

#########################################################
# DETECT RUNTIME
#########################################################

      - name: Detect Runtime
        run: |
          if [[ "${SERVICE}" == "ui" || "${SERVICE}" == "cart" || "${SERVICE}" == "orders" ]]; then
            echo "RUNTIME=java" >> $GITHUB_ENV
          elif [[ "${SERVICE}" == "checkout" ]]; then
            echo "RUNTIME=node" >> $GITHUB_ENV
          elif [[ "${SERVICE}" == "catalog" ]]; then
            echo "RUNTIME=go" >> $GITHUB_ENV
          else
            echo "Unknown service"
            exit 1
          fi

#########################################################
# DISPLAY RUNTIME
#########################################################

      - name: Display Runtime
        run: |
          echo "Runtime : ${RUNTIME}"

#########################################################
# JAVA SETUP
#########################################################

      - name: Setup Java
        if: env.RUNTIME == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

#########################################################
# NODE SETUP
#########################################################

      - name: Setup NodeJS
        if: env.RUNTIME == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

#########################################################
# GO SETUP
#########################################################

      - name: Setup Go
        if: env.RUNTIME == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

#########################################################
# SONARQUBE SCAN - JAVA
#########################################################

      - name: SonarQube Scan - Java
        if: env.RUNTIME == 'java'
        working-directory: src/${{ env.SERVICE }}
        run: |
          echo "Running SonarQube Scan for Java..."

          mvn clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
            -DskipTests \
            -Dsonar.projectKey=${SERVICE} \
            -Dsonar.projectName=${SERVICE} \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.token=${SONAR_TOKEN}

#########################################################
# SONARQUBE SCAN - NODE
#########################################################

      - name: SonarQube Scan - Node
        if: env.RUNTIME == 'node'
        working-directory: src/${{ env.SERVICE }}
        run: |
          echo "Running SonarQube Scan for Node..."

          if [ ! -f sonar-project.properties ]; then
            cat > sonar-project.properties <<EOF
            sonar.projectKey=${SERVICE}
            sonar.projectName=${SERVICE}
            sonar.sources=. 
            sonar.sourceEncoding=UTF-8
          EOF
          fi

          docker run --rm \
            -e SONAR_HOST_URL=${SONAR_HOST_URL} \
            -e SONAR_TOKEN=${SONAR_TOKEN} \
            -v "$(pwd):/usr/src" \
            -w /usr/src \
            sonarsource/sonar-scanner-cli:11.5 \
            sonar-scanner \
              -Dsonar.projectKey=${SERVICE} \
              -Dsonar.projectName=${SERVICE} \
              -Dsonar.sources=. \
              -Dsonar.host.url=${SONAR_HOST_URL} \
              -Dsonar.token=${SONAR_TOKEN}

#########################################################
# SONARQUBE SCAN - GO
#########################################################

      - name: SonarQube Scan - Go
        if: env.RUNTIME == 'go'
        working-directory: src/${{ env.SERVICE }}
        run: |
          echo "Running SonarQube Scan for Go..."

          if [ ! -f sonar-project.properties ]; then
            cat > sonar-project.properties <<EOF
            sonar.projectKey=${SERVICE}
            sonar.projectName=${SERVICE}
            sonar.sources=.
            sonar.sourceEncoding=UTF-8
          EOF
          fi

          docker run --rm \
            -e SONAR_HOST_URL=${SONAR_HOST_URL} \
            -e SONAR_TOKEN=${SONAR_TOKEN} \
            -v "$(pwd):/usr/src" \
            -w /usr/src \
            sonarsource/sonar-scanner-cli:11.5 \
            sonar-scanner \
              -Dsonar.projectKey=${SERVICE} \
              -Dsonar.projectName=${SERVICE} \
              -Dsonar.sources=. \
              -Dsonar.host.url=${SONAR_HOST_URL} \
              -Dsonar.token=${SONAR_TOKEN} \
              -Dsonar.scanner.skipJreProvisioning=true \
              -Dsonar.scanner.force-deprecated-java-version=false

#########################################################
# WAIT FOR SONAR ANALYSIS
#########################################################

      - name: Wait for SonarQube Analysis
        run: |
          echo "Waiting for SonarQube analysis to complete..."
          sleep 20

#########################################################
# VERIFY REQUIRED TOOLS
#########################################################

      - name: Verify Required Tools
        run: |
          command -v curl >/dev/null 2>&1 || { echo "curl not found"; exit 1; }
          command -v jq >/dev/null 2>&1 || { echo "jq not found"; exit 1; }

#########################################################
# SONARQUBE QUALITY GATE
#########################################################

      - name: SonarQube Quality Gate
        run: |
          echo "Checking SonarQube Quality Gate..."

          for i in {1..30}; do

           RESPONSE=$(curl -s \
           -u "${SONAR_TOKEN}:" \
           "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SERVICE}")

            STATUS=$(echo "$RESPONSE" | jq -r '.projectStatus.status')

            echo "Attempt ${i}: ${STATUS}"

            if [ "$STATUS" = "OK" ]; then
            echo "Quality Gate Passed"
            exit 0
           fi

           if [ "$STATUS" = "ERROR" ]; then
           echo "Quality Gate Failed"
           exit 1
           fi

           sleep 5
           done

           echo "Timed out waiting for SonarQube Quality Gate."
           exit 1
